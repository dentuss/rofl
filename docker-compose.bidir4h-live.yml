      SYMBOL: AVAX/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_avax_t_state:/app/state, live_avax_t_logs:/app/logs, live4h_cache:/app/.cache]
  avax-p:
    <<: *bot-defaults
    container_name: rofl4hL-avax-p
    environment:
      <<: *pull-env
      SYMBOL: AVAX/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_avax_p_state:/app/state, live_avax_p_logs:/app/logs, live4h_cache:/app/.cache]

  # Telegram button panel (Stats / Positions / Today / Health / Reconcile).
  # READ-ONLY: state files mounted ro, only Bybit read endpoints called.
  # API_KEY/SECRET -> main (triple) account, API_KEY2/SECRET2 -> pull sub.
  tg-control:
    build: .
    image: rofl-bot:latest
    container_name: rofl4hL-tg
    restart: unless-stopped
    command: ["python3", "tg_control.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EXCHANGE: ${EXCHANGE:-bybit}
      STATES_DIR: /states
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      API_KEY2: ${PULL_API_KEY:-}
      API_SECRET2: ${PULL_API_SECRET:-}
    volumes:
      - live_btc_t_state:/states/btc-t:ro
      - live_btc_p_state:/states/btc-p:ro
      - live_eth_t_state:/states/eth-t:ro
      - live_eth_p_state:/states/eth-p:ro
      - live_sol_t_state:/states/sol-t:ro
      - live_sol_p_state:/states/sol-p:ro
      - live_xrp_t_state:/states/xrp-t:ro
      - live_xrp_p_state:/states/xrp-p:ro
      - live_doge_t_state:/states/doge-t:ro
      - live_doge_p_state:/states/doge-p:ro
      - live_ada_t_state:/states/ada-t:ro
      - live_ada_p_state:/states/ada-p:ro
      - live_link_t_state:/states/link-t:ro
      - live_link_p_state:/states/link-p:ro
      - live_avax_t_state:/states/avax-t:ro
      - live_avax_p_state:/states/avax-p:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

