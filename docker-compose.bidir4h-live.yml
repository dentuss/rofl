      SYMBOL: SOL/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_sol_p_state:/app/state, live_sol_p_logs:/app/logs, live4h_cache:/app/.cache]

  xrp-t:
