    container_name: rofl4hL-eth-p
    environment:
      <<: *pull-env
      SYMBOL: ETH/USDT
    volumes: ["${ROFL_DATA:-./data}/live/eth-p/state:/app/state", "${ROFL_DATA:-./data}/live/eth-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  sol-t:
    <<: *bot-defaults
    container_name: rofl4hL-sol-t
    environment:
      <<: *triple-env
      SYMBOL: SOL/USDT
    volumes: ["${ROFL_DATA:-./data}/live/sol-t/state:/app/state", "${ROFL_DATA:-./data}/live/sol-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  sol-p:
    <<: *bot-defaults
    container_name: rofl4hL-sol-p
    environment:
      <<: *pull-env
      SYMBOL: SOL/USDT
    volumes: ["${ROFL_DATA:-./data}/live/sol-p/state:/app/state", "${ROFL_DATA:-./data}/live/sol-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  xrp-t:
    <<: *bot-defaults
    container_name: rofl4hL-xrp-t
    environment:
      <<: *triple-env
      SYMBOL: XRP/USDT
    volumes: ["${ROFL_DATA:-./data}/live/xrp-t/state:/app/state", "${ROFL_DATA:-./data}/live/xrp-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  xrp-p:
    <<: *bot-defaults
    container_name: rofl4hL-xrp-p
    environment:
      <<: *pull-env
      SYMBOL: XRP/USDT
    volumes: ["${ROFL_DATA:-./data}/live/xrp-p/state:/app/state", "${ROFL_DATA:-./data}/live/xrp-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  doge-t:
    <<: *bot-defaults
    container_name: rofl4hL-doge-t
    environment:
      <<: *triple-env
      SYMBOL: DOGE/USDT
    volumes: ["${ROFL_DATA:-./data}/live/doge-t/state:/app/state", "${ROFL_DATA:-./data}/live/doge-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  doge-p:
    <<: *bot-defaults
    container_name: rofl4hL-doge-p
    environment:
      <<: *pull-env
      SYMBOL: DOGE/USDT
    volumes: ["${ROFL_DATA:-./data}/live/doge-p/state:/app/state", "${ROFL_DATA:-./data}/live/doge-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  ada-t:
    <<: *bot-defaults
    container_name: rofl4hL-ada-t
    environment:
      <<: *triple-env
      SYMBOL: ADA/USDT
    volumes: ["${ROFL_DATA:-./data}/live/ada-t/state:/app/state", "${ROFL_DATA:-./data}/live/ada-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  ada-p:
    <<: *bot-defaults
    container_name: rofl4hL-ada-p
    environment:
      <<: *pull-env
      SYMBOL: ADA/USDT
    volumes: ["${ROFL_DATA:-./data}/live/ada-p/state:/app/state", "${ROFL_DATA:-./data}/live/ada-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  link-t:
    <<: *bot-defaults
    container_name: rofl4hL-link-t
    environment:
      <<: *triple-env
      SYMBOL: LINK/USDT
    volumes: ["${ROFL_DATA:-./data}/live/link-t/state:/app/state", "${ROFL_DATA:-./data}/live/link-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  link-p:
    <<: *bot-defaults
    container_name: rofl4hL-link-p
    environment:
      <<: *pull-env
      SYMBOL: LINK/USDT
    volumes: ["${ROFL_DATA:-./data}/live/link-p/state:/app/state", "${ROFL_DATA:-./data}/live/link-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  avax-t:
    <<: *bot-defaults
    container_name: rofl4hL-avax-t
    environment:
      <<: *triple-env
      SYMBOL: AVAX/USDT
    volumes: ["${ROFL_DATA:-./data}/live/avax-t/state:/app/state", "${ROFL_DATA:-./data}/live/avax-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  avax-p:
    <<: *bot-defaults
    container_name: rofl4hL-avax-p
    environment:
      <<: *pull-env
      SYMBOL: AVAX/USDT
    volumes: ["${ROFL_DATA:-./data}/live/avax-p/state:/app/state", "${ROFL_DATA:-./data}/live/avax-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  # Telegram button panel (Stats / Positions / Today / Health / Reconcile).
  # READ-ONLY: state files mounted ro, only Bybit read endpoints called.
  # API_KEY/SECRET -> main (triple) account, API_KEY2/SECRET2 -> pull sub.
  tg-control:
    build: .
    image: rofl-bot:4h-live
    container_name: rofl4hL-tg
    restart: unless-stopped
    command: ["python3", "tg_control.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EXCHANGE: ${EXCHANGE:-bybit}
      STATES_DIR: /states
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      API_KEY2: ${PULL_API_KEY:-}
      API_SECRET2: ${PULL_API_SECRET:-}
    volumes:
      - ${ROFL_DATA:-./data}/live/btc-t/state:/states/btc-t:ro
      - ${ROFL_DATA:-./data}/live/btc-p/state:/states/btc-p:ro
      - ${ROFL_DATA:-./data}/live/eth-t/state:/states/eth-t:ro
      - ${ROFL_DATA:-./data}/live/eth-p/state:/states/eth-p:ro
      - ${ROFL_DATA:-./data}/live/sol-t/state:/states/sol-t:ro
      - ${ROFL_DATA:-./data}/live/sol-p/state:/states/sol-p:ro
      - ${ROFL_DATA:-./data}/live/xrp-t/state:/states/xrp-t:ro
      - ${ROFL_DATA:-./data}/live/xrp-p/state:/states/xrp-p:ro
      - ${ROFL_DATA:-./data}/live/doge-t/state:/states/doge-t:ro
      - ${ROFL_DATA:-./data}/live/doge-p/state:/states/doge-p:ro
      - ${ROFL_DATA:-./data}/live/ada-t/state:/states/ada-t:ro
      - ${ROFL_DATA:-./data}/live/ada-p/state:/states/ada-p:ro
      - ${ROFL_DATA:-./data}/live/link-t/state:/states/link-t:ro
      - ${ROFL_DATA:-./data}/live/link-p/state:/states/link-p:ro
      - ${ROFL_DATA:-./data}/live/avax-t/state:/states/avax-t:ro
      - ${ROFL_DATA:-./data}/live/avax-p/state:/states/avax-p:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  live4h_cache:
