# 4h LIVE portfolio — the promoted BLEND50_CONF trend book, REAL MONEY.
#
# LIVE-FIRST program (user decision 2026-07-06; replaces the paper-first
# track): the full account at UNIT WEIGHTS — backtest dMDD -4.5% daily /
# -6.0% long-history month-end, worst month -1.7%, so the shakedown risks
# ~$110 worst-path while gathering REAL fills. See research/ROADMAP.md
# "Phase 6" for the L1/L2/L3 stages and the pre-registered kill criteria
# (book -8% from start halts = ~$144 at this size). The vol dial (x2.1+)
# comes ONLY after L1+L2 are green — sizing anchored on full-history
# Sharpe ~1.2, not the post-2023 1.5.
#
# Book: MAJORS8 x {triple_bidir tp6, pullback_in_trend} at 50/50 capital,
# full adopted overlay stack + REGIME_CONF_SIZING + TP_LIMIT_ORDERS +
# ENTRY_LIMIT_ORDERS (post-only maker entries — the engine's adopted cost
# model; unit-tested in test_maker_entries.py).
#
# SPLITS for the current deposit of $1,800.00 (2026-07-30): all 16 legs
# EQUAL at $112.50 (16 x 112.50 = 1800.00 exactly), $900.00 per account.
# Equal weights are what the backtest validated — at this deposit an
# ex-BTC premium slice would make BTC ~33% of the book, an unvalidated
# concentration bet. Known friction instead: BTC's 0.001 lot (~$64
# notional) sits near the risk-scaled size, so BTC trades slightly
# under-sized in normal vol and SKIPS in high vol (logged as min-notional
# skips — watch the rate during L1; that is data, not a bug).
#
# TWO ACCOUNTS — REQUIRED, NOT OPTIONAL. The -t and -p legs trade the SAME
# symbols; two bots on one account would NET against each other (a pullback
# short would reduce the triple long) and trip every reconcile guard
# (Pattern A). Before L1:
#   1. create a Bybit SUB-ACCOUNT for the pullback book
#   2. transfer the p-book capital to it (8 x $112.50 = $900.00)
#   3. cut an IP-whitelisted, trade-only key for it
#   4. export PULL_API_KEY / PULL_API_SECRET on the live box
# The -t legs use API_KEY/API_SECRET (main), the -p legs use PULL_API_KEY/
# PULL_API_SECRET (sub). tg-control reads both (API_KEY2 = the sub key).
#
# Ops rules (see CLAUDE.md + research/FINDINGS.md):
#   - trading key lives ONLY on the single IP-whitelisted live box,
#     trade-only permissions (NO withdrawal); keys via env
#     (API_KEY/API_SECRET), never in this file
#   - NEVER run this alongside any other LIVE portfolio (the paper stack
#     rofl4h-* is fine — it holds no keys and touches nothing)
#   - all closes are reduce-only (bot enforces; do not override)
#
# Run (on the live box, after the green light):
#   docker compose -f docker-compose.bidir4h-live.yml up -d --build
#   docker compose -f docker-compose.bidir4h-live.yml logs -f
#   docker compose -f docker-compose.bidir4h-live.yml down

# Explicit project name + dedicated image tag: without these, the paper and
# live stacks share the directory-derived project ("--remove-orphans" on one
# would DESTROY the other's containers) and the mutable rofl-bot:latest tag
# (a paper rebuild would silently swap unvalidated code under live at the
# next recreate).
name: rofl4h-live

x-bot: &bot-defaults
  build: .
  image: rofl-bot:4h-live
  restart: unless-stopped
  # Measured 2026-08-03 on the real image: 198 MB PRIVATE per leg (322 MB RSS,
  # but 124 MB of that is library pages shared across all legs from the one
  # image — see deploy/ORACLE.md §2). 512m is ~2.5x the marginal cost, so a
  # leaking leg is killed and restarted by Docker instead of OOMing a 10 GB
  # box and taking the other 15 legs with it.
  mem_limit: 512m
  memswap_limit: 768m
  healthcheck:
    test: ["CMD-SHELL", "[ $(($(date +%s) - $(stat -c %Y /app/state/heartbeat 2>/dev/null || echo 0))) -lt 300 ]"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 180s
  environment: &env-defaults
    MODE: live
    EXCHANGE: ${EXCHANGE:-bybit}
    API_KEY: ${API_KEY:-}
    API_SECRET: ${API_SECRET:-}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    TL_TP_MULT: "6.0"
    COOLDOWN_BARS: "2"                       # == engine K=3 (signal-bar gate)
    CHOP_RISK_MULT: "0.5"
    VOL_TARGET_ANN: "0.60"
    REGIME_CONF_SIZING: "1"
    # TP as resting maker limit (engine tp_as_limit parity). L1 verifies the
    # first real fill; set "0" to fall back to conditional market TPs if
    # Bybit rejects the Partial/Limit attach on any symbol.
    TP_LIMIT_ORDERS: "1"
    # Post-only maker entries (engine maker_close parity): limit at signal
    # close, rests one bar, miss is missed. Set "0" to fall back to market
    # entries (costs ~4bp+slip more per entry; expectations shift down).
    ENTRY_LIMIT_ORDERS: "1"
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-triple: &triple-env
  <<: *env-defaults
  STRATEGY_PRESET: adaptive_bidir_4h
  STARTING_EQUITY: ${TRIPLE_LEG_EQUITY:-158.06}

x-pull: &pull-env
  <<: *env-defaults
  STRATEGY_PRESET: pullback_bidir_4h
  STARTING_EQUITY: ${PULL_LEG_EQUITY:-52.69}
  # SUB-ACCOUNT key — see the two-accounts header block. Empty = the -p legs
  # refuse to trade live (ccxt auth fails loudly), which is the safe default.
  API_KEY: ${PULL_API_KEY:-}
  API_SECRET: ${PULL_API_SECRET:-}

# Per-service capital — BLEND75 (0.75 triple / 0.25 pull), demoted from the
# 50/50 blend on 2026-08-13. The weights are NOT equal any more, so the single
# per-leg var is gone: the -t legs read TRIPLE_LEG_EQUITY and the -p legs read
# PULL_LEG_EQUITY, both set on the x-triple / x-pull anchors above.
#
#   book 1,686.00  ->  triple 0.75 = 1,264.48 / 8 = 158.06 per -t leg
#                      pull   0.25 =   421.52 / 8 =  52.69 per -p leg
#
# Capital RE-BASED 2026-08-17 after the operator withdrew 100 USDT from the
# sub (sub UNIFIED -> main FUND -> off-book, 2026-08-16). Measured on-exchange
# total at reset: main 888.57 + sub 797.42 = 1,685.99.
#
# WHY (research/FINDINGS.md 2026-08-13): the PULL leg fails the sleeve law
# standalone (full Sh 0.35 < 0.5, pre-2023 -2.53 < 0) on 70 real pre-2023
# trades — NOT the thin sample the 2026-07-06 caveat claimed. Full-history
# Sharpe is flat across 0->50% pull (0.99/1.01/1.02), so the leg bought ~+0.03
# for a -0.39 pre-2023 cost. BLEND75 keeps the diversification (corr +0.12,
# MDD -7.4% vs triple-only -9.5%) at pre-2023 +0.43 vs the live book's +0.17.
# This is the demotion PRE-REGISTERED on 2026-07-06, not a new weight search.
#
# The vol dial in L3 scales both numbers, keeping the 75/25 ratio.
#
# CAPITAL MUST MOVE WITH THE WEIGHTS. The -t legs draw on the MAIN account and
# the -p legs on the SUB; the accounts must hold 1,346.40 / 448.80. The trading
# keys are trade-only (NO transfer permission, by design), so the rebalance is
# a MANUAL step in the Bybit UI before restarting. Changing the numbers here
# without moving the cash gives every leg the wrong margin base.
services:
  btc-t:
    <<: *bot-defaults
    container_name: rofl4hL-btc-t
    environment:
      <<: *triple-env
      SYMBOL: BTC/USDT
    volumes: ["${ROFL_DATA:-./data}/live/btc-t/state:/app/state", "${ROFL_DATA:-./data}/live/btc-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  btc-p:
    <<: *bot-defaults
    container_name: rofl4hL-btc-p
    environment:
      <<: *pull-env
      SYMBOL: BTC/USDT
    volumes: ["${ROFL_DATA:-./data}/live/btc-p/state:/app/state", "${ROFL_DATA:-./data}/live/btc-p/logs:/app/logs", "live4h_cache:/app/.cache"]

  eth-t:
    <<: *bot-defaults
    container_name: rofl4hL-eth-t
    environment:
      <<: *triple-env
      SYMBOL: ETH/USDT
    volumes: ["${ROFL_DATA:-./data}/live/eth-t/state:/app/state", "${ROFL_DATA:-./data}/live/eth-t/logs:/app/logs", "live4h_cache:/app/.cache"]
  eth-p:
