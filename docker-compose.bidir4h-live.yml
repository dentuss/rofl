    volumes: [live_link_t_state:/app/state, live_link_t_logs:/app/logs, live4h_cache:/app/.cache]
  link-p:
    <<: *bot-defaults
    container_name: rofl4hL-link-p
    environment:
      <<: *pull-env
      SYMBOL: LINK/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
