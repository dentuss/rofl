      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_xrp_t_state:/app/state, live_xrp_t_logs:/app/logs, live4h_cache:/app/.cache]
  xrp-p:
    <<: *bot-defaults
    container_name: rofl4hL-xrp-p
    environment:
      <<: *pull-env
      SYMBOL: XRP/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_xrp_p_state:/app/state, live_xrp_p_logs:/app/logs, live4h_cache:/app/.cache]

  doge-t:
