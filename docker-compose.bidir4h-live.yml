      SYMBOL: SOL/USDT
      STARTING_EQUITY: ${LEG4H_LIVE_EQUITY:-121}
    volumes: [live_sol_t_state:/app/state, live_sol_t_logs:/app/logs, live4h_cache:/app/.cache]
  sol-p:
