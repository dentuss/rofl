# 4h PAPER portfolio — the honest-rebuild validated config, dry-run only.
#
# This is the forward test for the 4h port (research/FINDINGS.md 2026-07-05,
# honest-era baseline): triple_bidir on 4h bars + regime + F&G + decay,
# TL_TP_MULT=6.0, COOLDOWN_BARS=2 (== engine K=3, adopted). EW5 equal weights
# of a $2300 notional book: 460 per pair (EW5 superseded the SOFT5 weighting,
# baseline_promote.py). CHOP half-sizing is wired (CHOP_RISK_MULT=0.5, bot.py
# _effective_risk) — this book now runs the full promoted RSCD3 stack.
#
# Honest backtest expectations (2.88y Bybit, fixed engine, fees+funding):
#   CAGR ~15%, Sharpe(mo) ~1.0, MDD ~-10%, worst month ~-6%, ~2 trades/wk/pair.
# The paper period exists to compare LIVE fills/decisions against these
# numbers before any real-money discussion. MODE is pinned to paper — this
# file intentionally has no key passthrough.
#
# Run:
#   docker compose -f docker-compose.bidir4h-paper.yml up -d --build
#   docker compose -f docker-compose.bidir4h-paper.yml logs -f
#   docker compose -f docker-compose.bidir4h-paper.yml down
#
# Do NOT run alongside a live portfolio that shares container names — these
# use rofl4h-* names and separate volumes precisely so they can coexist with
# nothing. Check `docker ps` anyway.

x-bot: &bot-defaults
  build: .
  image: rofl-bot:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "[ $(($(date +%s) - $(stat -c %Y /app/state/heartbeat 2>/dev/null || echo 0))) -lt 300 ]"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 180s
  environment: &env-defaults
    MODE: paper                              # pinned — no keys in this file
    EXCHANGE: ${EXCHANGE:-bybit}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    STRATEGY_PRESET: adaptive_bidir_4h       # 4h port, symbol-agnostic
    TL_TP_MULT: "6.0"                        # validated exit (honest_rebuild_r2/r3)
    # Engine K=3 was adopted 2026-07-05 (baseline_promote.py); the live gate
    # compares the SIGNAL bar's ts (one bar stricter), so live 2 == engine 3.
    COOLDOWN_BARS: "2"
    # CHOP half-sizing — the second adopted honest-era layer (RSCD3 stack)
    CHOP_RISK_MULT: "0.5"
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  inj-bot:
    <<: *bot-defaults
    container_name: rofl4h-inj
    environment:
      <<: *env-defaults
      SYMBOL: INJ/USDT
      STARTING_EQUITY: ${INJ4H_EQUITY:-460}
    volumes:
      - inj4h_state:/app/state
      - inj4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  sol-bot:
    <<: *bot-defaults
    container_name: rofl4h-sol
    environment:
      <<: *env-defaults
      SYMBOL: SOL/USDT
      STARTING_EQUITY: ${SOL4H_EQUITY:-460}
    volumes:
      - sol4h_state:/app/state
      - sol4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  ada-bot:
    <<: *bot-defaults
    container_name: rofl4h-ada
    environment:
      <<: *env-defaults
      SYMBOL: ADA/USDT
      STARTING_EQUITY: ${ADA4H_EQUITY:-460}
    volumes:
      - ada4h_state:/app/state
      - ada4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  eth-bot:
    <<: *bot-defaults
    container_name: rofl4h-eth
    environment:
      <<: *env-defaults
      SYMBOL: ETH/USDT
      STARTING_EQUITY: ${ETH4H_EQUITY:-460}
    volumes:
      - eth4h_state:/app/state
      - eth4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  link-bot:
    <<: *bot-defaults
    container_name: rofl4h-link
    environment:
      <<: *env-defaults
      SYMBOL: LINK/USDT
      STARTING_EQUITY: ${LINK4H_EQUITY:-460}
    volumes:
      - link4h_state:/app/state
      - link4h_logs:/app/logs
      - shared4h_cache:/app/.cache

volumes:
  inj4h_state:
  inj4h_logs:
  sol4h_state:
  sol4h_logs:
  ada4h_state:
  ada4h_logs:
  eth4h_state:
  eth4h_logs:
  link4h_state:
  link4h_logs:
  shared4h_cache:
