# 4h PAPER portfolio — the honest-rebuild validated config, dry-run only.
#
# This is the forward test for the 4h port (research/FINDINGS.md 2026-07-05,
# honest_rebuild_r2/r3): triple_bidir on 4h bars + regime + F&G + decay,
# TL_TP_MULT=6.0, COOLDOWN_BARS=0 (a 1-bar cooldown is subsumed by the
# same-bar-re-entry engine fix; no K re-validated on 4h). SOFT5 weights of a
# $2300 notional book: INJ 575 / SOL,ADA,ETH,LINK 431.25.
#
# Honest backtest expectations (2.88y Bybit, fixed engine, fees+funding):
#   CAGR ~15%, Sharpe(mo) ~1.0, MDD ~-10%, worst month ~-6%, ~2 trades/wk/pair.
# The paper period exists to compare LIVE fills/decisions against these
# numbers before any real-money discussion. MODE is pinned to paper — this
# file intentionally has no key passthrough.
#
# Run:
#   docker compose -f docker-compose.bidir4h-paper.yml up -d --build
#   docker compose -f docker-compose.bidir4h-paper.yml logs -f
#   docker compose -f docker-compose.bidir4h-paper.yml down
#
# Do NOT run alongside a live portfolio that shares container names — these
# use rofl4h-* names and separate volumes precisely so they can coexist with
# nothing. Check `docker ps` anyway.

x-bot: &bot-defaults
  build: .
  image: rofl-bot:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "[ $(($(date +%s) - $(stat -c %Y /app/state/heartbeat 2>/dev/null || echo 0))) -lt 300 ]"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 180s
  environment: &env-defaults
    MODE: paper                              # pinned — no keys in this file
    EXCHANGE: ${EXCHANGE:-bybit}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    STRATEGY_PRESET: adaptive_bidir_4h       # 4h port, symbol-agnostic
    TL_TP_MULT: "6.0"                        # validated exit (honest_rebuild_r2/r3)
    COOLDOWN_BARS: "0"                       # not validated on 4h; engine fix covers bar-0
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  inj-bot:
    <<: *bot-defaults
    container_name: rofl4h-inj
    environment:
      <<: *env-defaults
      SYMBOL: INJ/USDT
      STARTING_EQUITY: ${INJ4H_EQUITY:-575}
    volumes:
      - inj4h_state:/app/state
      - inj4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  sol-bot:
    <<: *bot-defaults
    container_name: rofl4h-sol
    environment:
      <<: *env-defaults
      SYMBOL: SOL/USDT
      STARTING_EQUITY: ${SOL4H_EQUITY:-431.25}
    volumes:
      - sol4h_state:/app/state
      - sol4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  ada-bot:
    <<: *bot-defaults
    container_name: rofl4h-ada
    environment:
      <<: *env-defaults
      SYMBOL: ADA/USDT
      STARTING_EQUITY: ${ADA4H_EQUITY:-431.25}
    volumes:
      - ada4h_state:/app/state
      - ada4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  eth-bot:
    <<: *bot-defaults
    container_name: rofl4h-eth
    environment:
      <<: *env-defaults
      SYMBOL: ETH/USDT
      STARTING_EQUITY: ${ETH4H_EQUITY:-431.25}
    volumes:
      - eth4h_state:/app/state
      - eth4h_logs:/app/logs
      - shared4h_cache:/app/.cache

  link-bot:
    <<: *bot-defaults
    container_name: rofl4h-link
    environment:
      <<: *env-defaults
      SYMBOL: LINK/USDT
      STARTING_EQUITY: ${LINK4H_EQUITY:-431.25}
    volumes:
      - link4h_state:/app/state
      - link4h_logs:/app/logs
      - shared4h_cache:/app/.cache

volumes:
  inj4h_state:
  inj4h_logs:
  sol4h_state:
  sol4h_logs:
  ada4h_state:
  ada4h_logs:
  eth4h_state:
  eth4h_logs:
  link4h_state:
  link4h_logs:
  shared4h_cache:
