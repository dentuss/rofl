# 4h PAPER portfolio — the PROMOTED BLEND50_CONF trend book, dry-run only.
#
# Phase-4/5 promotion (research/FINDINGS.md 2026-07-06): MAJORS8 x two entry
# legs at 50/50 capital —
#   triple leg    adaptive_bidir_4h  (triple_bidir tp6)
#   pullback leg  pullback_bidir_4h  (EMA50 side + RSI 40/60 recross, tp6)
# both under the full adopted overlay stack: walk-forward regime mask + F&G
# 3-day persistence + decay tiers + CHOP half-size + vol targeting + GMM
# confidence sizing (REGIME_CONF_SIZING) + SL cooldown.
#
# Honest backtest expectations for the whole book (2.9y Bybit, fixed engine,
# maker entries, TP-as-limit, real funding; daily granularity):
#   unit weights: CAGR ~10.4%, Sh(mo) ~1.50, dMDD ~-4.5%, worst month ~-1.7%
#   @25% vol (x3.5): CAGR ~37.9%, Sh ~1.48, dMDD ~-15.1%, worst mo ~-5.8%
# The pullback leg trades RARELY (~1 trade/6wk/pair, in-market 4-8%) — long
# idle stretches on the -p services are EXPECTED, not a bug.
# The paper period compares live fills/decisions against these numbers before
# any real-money discussion. MODE is pinned to paper — no key passthrough.
#
# $1,800.00 book / 16 services = $112.50 per service (equal split), matching
# the live compose so paper and live are directly comparable.
#
# Run:
#   docker compose -f docker-compose.bidir4h-paper.yml up -d --build
#   docker compose -f docker-compose.bidir4h-paper.yml logs -f
#   docker compose -f docker-compose.bidir4h-paper.yml down
#
# Do NOT run alongside a live portfolio that shares container names — these
# use rofl4h-* names and separate volumes. Check `docker ps` anyway.

# Explicit project name + dedicated image tag — keeps this stack fully
# isolated from the live one (project orphan-removal and image-tag reuse
# both bite otherwise; see the live compose header).
name: rofl4h-paper

x-bot: &bot-defaults
  build: .
  image: rofl-bot:4h-paper
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "[ $(($(date +%s) - $(stat -c %Y /app/state/heartbeat 2>/dev/null || echo 0))) -lt 300 ]"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 180s
  environment: &env-defaults
    MODE: paper                              # pinned — no keys in this file
    EXCHANGE: ${EXCHANGE:-bybit}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    TL_TP_MULT: "6.0"                        # validated exit (honest_rebuild_r2/r3)
    # Engine K=3 adopted; the live gate compares the SIGNAL bar's ts (one bar
    # stricter), so live 2 == engine 3.
    COOLDOWN_BARS: "2"
    CHOP_RISK_MULT: "0.5"                    # RSCD3 half-sizing (adopted)
    VOL_TARGET_ANN: "0.60"                   # vol targeting (adopted, G4)
    REGIME_CONF_SIZING: "1"                  # GMM-confidence sizing (adopted 2026-07-06)
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-triple: &triple-env
  <<: *env-defaults
  STRATEGY_PRESET: adaptive_bidir_4h

x-pull: &pull-env
  <<: *env-defaults
  STRATEGY_PRESET: pullback_bidir_4h

services:
  btc-t:
    <<: *bot-defaults
    container_name: rofl4h-btc-t
    environment:
      <<: *triple-env
      SYMBOL: BTC/USDT
      STARTING_EQUITY: ${LEG4H_EQUITY:-112.50}
    volumes: [btc_t_state:/app/state, btc_t_logs:/app/logs, shared4h_cache:/app/.cache]
  btc-p:
    <<: *bot-defaults
    container_name: rofl4h-btc-p
    environment:
      <<: *pull-env
      SYMBOL: BTC/USDT
      STARTING_EQUITY: ${LEG4H_EQUITY:-112.50}
    volumes: [btc_p_state:/app/state, btc_p_logs:/app/logs, shared4h_cache:/app/.cache]

  eth-t:
    <<: *bot-defaults
    container_name: rofl4h-eth-t
