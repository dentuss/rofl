# 8-pair BIDIR portfolio — equal weight, narrative-diversified.
#
# *** STATUS 2026-07-02: ON HOLD — NOT the current go-live. The Bybit-perp OOS
# *** robustness study (research/portfolio_robustness.py) found this basket's
# *** edge overfit: IS monthly Sharpe 4.60 decays to 2.70 OOS, worst month
# *** -9.6%. Production is the SOFT5 5-pair (deploy/LIVE.md §0). Everything
# *** below stays wired (cooldown, tg-control) if fresh OOS evidence reverses
# *** the call.
#
# Selection rationale (research/expand_universe.py + portfolio_construction.py;
# NOTE: these are the older KuCoin in-sample numbers, superseded by the OOS
# study above):
# 20 of 33 swept pairs clear Sharpe >= 1.1 with the production strategy, and
# best-N analysis peaks around 7-8 equal-weight pairs (Sharpe ~2.4, worst
# month ~-11% vs -16% on 3 pairs). Pairs chosen for narrative diversity, not
# top-N Sharpe (per-window rankings don't persist):
#   L1s:        INJ, AVAX, NEAR
#   DeFi/infra: AAVE, GRT, RUNE
#   Meme:       DOGE
#   L1 value:   ADA
# Equal weight 12.5% each (weight optimization adds nothing — see FINDINGS).
#
# Run via the wrapper (computes the split from TOTAL_EQUITY). Use `sudo -E` so
# the PORTFOLIO/TOTAL_EQUITY vars survive into the wrapper — WITHOUT -E, sudo
# strips them and the wrapper silently falls back to the 5-pair at $100:
#   PORTFOLIO=8 TOTAL_EQUITY=<total> sudo -E ./portfolio.sh up -d --build
#   PORTFOLIO=8 sudo -E ./portfolio.sh status
# Most robust: put PORTFOLIO=8 and TOTAL_EQUITY in .env (then plain sudo is
# fine — the wrapper reads them from the file). REMOVE any 5-pair *_WEIGHT
# lines from .env first: INJ_WEIGHT/ADA_WEIGHT are read by BOTH portfolios and
# the wrapper aborts if weights don't sum to 1.0. Bring the 5-pair fully DOWN
# first (they share the rofl-inj/rofl-ada/rofl-tgcontrol names and the INJ/ADA
# exchange positions — never run both portfolios at once).

x-bot: &bot-defaults
  build: .
  image: rofl-bot:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "[ $(($(date +%s) - $(stat -c %Y /app/state/heartbeat 2>/dev/null || echo 0))) -lt 300 ]"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 180s
  environment: &env-defaults
    MODE: ${MODE:-paper}
    EXCHANGE: ${EXCHANGE:-bybit}
    API_KEY: ${API_KEY:-}
    API_SECRET: ${API_SECRET:-}
    API_PASSPHRASE: ${API_PASSPHRASE:-}
    POLL_SECONDS: ${POLL_SECONDS:-30}
    STRATEGY_PRESET: adaptive_bidir
    COOLDOWN_BARS: ${COOLDOWN_BARS:-3}       # post-SL same-side re-entry block (bars/hours)
    TRUST_STATE: ${TRUST_STATE:-}            # =1 overrides the STATE/SLICE preflight halt
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  inj-bot:
    <<: *bot-defaults
    container_name: rofl-inj
    environment:
      <<: *env-defaults
      SYMBOL: INJ/USDT
      STARTING_EQUITY: ${INJ_EQUITY:-12.5}
    volumes: [inj8_state:/app/state, inj8_logs:/app/logs, shared_cache:/app/.cache]

  avax-bot:
    <<: *bot-defaults
    container_name: rofl-avax
    environment:
      <<: *env-defaults
      SYMBOL: AVAX/USDT
      STARTING_EQUITY: ${AVAX_EQUITY:-12.5}
    volumes: [avax_state:/app/state, avax_logs:/app/logs, shared_cache:/app/.cache]

  near-bot:
    <<: *bot-defaults
    container_name: rofl-near
    environment:
      <<: *env-defaults
      SYMBOL: NEAR/USDT
      STARTING_EQUITY: ${NEAR_EQUITY:-12.5}
    volumes: [near_state:/app/state, near_logs:/app/logs, shared_cache:/app/.cache]

  aave-bot:
    <<: *bot-defaults
    container_name: rofl-aave
    environment:
      <<: *env-defaults
      SYMBOL: AAVE/USDT
      STARTING_EQUITY: ${AAVE_EQUITY:-12.5}
    volumes: [aave_state:/app/state, aave_logs:/app/logs, shared_cache:/app/.cache]

  grt-bot:
    <<: *bot-defaults
    container_name: rofl-grt
    environment:
      <<: *env-defaults
      SYMBOL: GRT/USDT
      STARTING_EQUITY: ${GRT_EQUITY:-12.5}
    volumes: [grt_state:/app/state, grt_logs:/app/logs, shared_cache:/app/.cache]

  rune-bot:
    <<: *bot-defaults
    container_name: rofl-rune
    environment:
      <<: *env-defaults
      SYMBOL: RUNE/USDT
      STARTING_EQUITY: ${RUNE_EQUITY:-12.5}
    volumes: [rune_state:/app/state, rune_logs:/app/logs, shared_cache:/app/.cache]

  doge-bot:
    <<: *bot-defaults
    container_name: rofl-doge
    environment:
      <<: *env-defaults
      SYMBOL: DOGE/USDT
      STARTING_EQUITY: ${DOGE_EQUITY:-12.5}
    volumes: [doge_state:/app/state, doge_logs:/app/logs, shared_cache:/app/.cache]

  ada-bot:
    <<: *bot-defaults
    container_name: rofl-ada
    environment:
      <<: *env-defaults
      SYMBOL: ADA/USDT
      STARTING_EQUITY: ${ADA_EQUITY:-12.5}
    volumes: [ada8_state:/app/state, ada8_logs:/app/logs, shared_cache:/app/.cache]

  # Interactive Telegram control: ONE process that long-polls getUpdates and
  # answers Stats / Positions / Today / Health / Reconcile for the 8-pair
  # portfolio. Reads each bot's state volume READ-ONLY and queries Bybit
  # read-only for live equity/positions. Places no orders. Send /menu to the bot.
  # (tg_control.py is portfolio-agnostic — it discovers whichever <bot> dirs are
  #  mounted under /states, so the same image serves 5-pair and 8-pair.)
  tg-control:
    build: .
    image: rofl-bot:latest
    container_name: rofl-tgcontrol
    restart: unless-stopped
    command: ["python3", "tg_control.py"]
    environment:
      EXCHANGE: ${EXCHANGE:-bybit}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STATES_DIR: /states
    volumes:
      - inj8_state:/states/inj:ro
      - avax_state:/states/avax:ro
      - near_state:/states/near:ro
      - aave_state:/states/aave:ro
      - grt_state:/states/grt:ro
      - rune_state:/states/rune:ro
      - doge_state:/states/doge:ro
      - ada8_state:/states/ada:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  inj8_state:
  avax_state:
  near_state:
  aave_state:
  grt_state:
  rune_state:
  doge_state:
  ada8_state:
  inj8_logs:
  avax_logs:
  near_logs:
  aave_logs:
  grt_logs:
  rune_logs:
  doge_logs:
  ada8_logs:
  shared_cache:
